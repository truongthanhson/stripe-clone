openapi: 3.0.3
info:
  title: stripe-clone API
  version: "2026-10-23"
  description: |
    A payments API modeled on Stripe's. Requests are form-encoded (`curl -d amount=2000`);
    responses are JSON. Authenticate with `Authorization: Bearer sk_test_...` or `sk_live_...`.

    Versioning: this document describes the latest version, 2026-10-23. Each merchant is pinned to
    the version current when they signed up; send `Stripe-Version: YYYY-MM-DD` to use another for one
    request. Every response carries the `Stripe-Version` it was rendered for. Changes:
    - 2026-10-23: capture_method defaults to automatic_async instead of automatic. Earlier versions
      see automatic_async reported as automatic.

    This file is the source of truth: the server rejects parameters it does not list, and the
    test suite fails when a handler returns a field or route that is not described here.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: GetHealth
      summary: Liveness and database check
      security: []
      responses:
        "200":
          description: The API and its database are up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /openapi.yaml:
    get:
      operationId: GetOpenAPISpec
      summary: This document
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }

  /v1/account:
    get:
      operationId: GetAccount
      summary: The merchant behind the API key
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        default: { $ref: "#/components/responses/Error" }

  /v1/payment_intents:
    get:
      operationId: ListPaymentIntents
      summary: List PaymentIntents, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
        - name: customer
          in: query
          description: Only PaymentIntents of this customer.
          schema: { type: string }
      responses:
        "200":
          description: A page of PaymentIntents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntentList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: CreatePaymentIntent
      summary: Create a PaymentIntent, and optionally confirm it in the same call
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount:
                  type: integer
                  description: In the currency's smallest unit; 2000 with usd is $20.00.
                currency:
                  type: string
                  description: "Three-letter ISO code, lowercase. Supported: eur, gbp, jpy, usd, vnd."
                capture_method: { $ref: "#/components/schemas/CaptureMethod" }
                confirm:
                  type: boolean
                  description: Confirm immediately; requires payment_method.
                customer:
                  type: string
                  description: A customer (cus_...) of the same merchant and mode.
                description: { type: string, maxLength: 1000 }
                metadata: { $ref: "#/components/schemas/MetadataParam" }
                payment_method:
                  type: string
                  description: A test payment method such as pm_card_visa.
            encoding:
              metadata: { style: deepObject, explode: true }
      responses:
        "200":
          description: The PaymentIntent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        default: { $ref: "#/components/responses/Error" }

  /v1/payment_intents/{id}:
    parameters:
      - $ref: "#/components/parameters/IntentID"
    get:
      operationId: GetPaymentIntent
      summary: Retrieve a PaymentIntent
      responses:
        "200":
          description: The PaymentIntent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: UpdatePaymentIntent
      summary: Update description and metadata, at any status
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                description: { type: string, maxLength: 1000 }
                metadata: { $ref: "#/components/schemas/MetadataParam" }
            encoding:
              metadata: { style: deepObject, explode: true }
      responses:
        "200":
          description: The updated PaymentIntent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        default: { $ref: "#/components/responses/Error" }

  /v1/payment_intents/{id}/confirm:
    parameters:
      - $ref: "#/components/parameters/IntentID"
    post:
      operationId: ConfirmPaymentIntent
      summary: Charge (or authorize, with manual capture) the payment method
      description: |
        A decline returns 402 with a card_error whose payment_intent is back in requires_payment_method.
        If the card network does not answer in time, the PaymentIntent stays processing.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                payment_method: { type: string }
      responses:
        "200":
          description: The PaymentIntent, succeeded, requires_capture or processing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        default: { $ref: "#/components/responses/Error" }

  /v1/payment_intents/{id}/capture:
    parameters:
      - $ref: "#/components/parameters/IntentID"
    post:
      operationId: CapturePaymentIntent
      summary: Capture an authorized PaymentIntent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                amount_to_capture:
                  type: integer
                  description: Defaults to amount_capturable; the rest is released.
      responses:
        "200":
          description: The succeeded PaymentIntent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        default: { $ref: "#/components/responses/Error" }

  /v1/payment_intents/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/IntentID"
    post:
      operationId: CancelPaymentIntent
      summary: Cancel a PaymentIntent that has not succeeded, releasing any hold
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                cancellation_reason: { $ref: "#/components/schemas/CancellationReason" }
      responses:
        "200":
          description: The canceled PaymentIntent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        default: { $ref: "#/components/responses/Error" }

  /v1/customers:
    get:
      operationId: ListCustomers
      summary: List customers, newest first (deleted ones are left out)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
        - name: email
          in: query
          description: Only customers with this email, compared case-insensitively.
          schema: { type: string }
      responses:
        "200":
          description: A page of customers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: CreateCustomer
      summary: Create a customer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/CustomerParams" }
            encoding:
              metadata: { style: deepObject, explode: true }
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        default: { $ref: "#/components/responses/Error" }

  /v1/customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: GetCustomer
      summary: Retrieve a customer; a deleted one comes back as {id, object, deleted}
      responses:
        "200":
          description: The customer, or its deletion marker.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Customer"
                  - $ref: "#/components/schemas/DeletedCustomer"
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: UpdateCustomer
      summary: Update a customer; an empty value clears a field
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/CustomerParams" }
            encoding:
              metadata: { style: deepObject, explode: true }
      responses:
        "200":
          description: The updated customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: DeleteCustomer
      summary: Delete a customer; its payments keep pointing at it
      responses:
        "200":
          description: The deletion marker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedCustomer" }
        default: { $ref: "#/components/responses/Error" }

  /v1/refunds:
    get:
      operationId: ListRefunds
      summary: List refunds, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
        - name: payment_intent
          in: query
          description: Only refunds of this PaymentIntent.
          schema: { type: string }
      responses:
        "200":
          description: A page of refunds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: CreateRefund
      summary: Refund all or part of a succeeded PaymentIntent
      description: |
        The refund is pending while the card network processes it, succeeded once the money is
        returned (and recorded in the ledger), or failed if the issuer refuses it. Several partial
        refunds can never add up to more than the amount received.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [payment_intent]
              properties:
                payment_intent: { type: string }
                amount:
                  type: integer
                  description: Defaults to everything still refundable.
                reason: { type: string, enum: [duplicate, fraudulent, requested_by_customer] }
                metadata: { $ref: "#/components/schemas/MetadataParam" }
            encoding:
              metadata: { style: deepObject, explode: true }
      responses:
        "200":
          description: The refund.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refund" }
        default: { $ref: "#/components/responses/Error" }

  /v1/refunds/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: GetRefund
      summary: Retrieve a refund
      responses:
        "200":
          description: The refund.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refund" }
        default: { $ref: "#/components/responses/Error" }

  /v1/balance:
    get:
      operationId: GetBalance
      summary: The merchant's balance per currency, derived from the ledger
      responses:
        "200":
          description: The balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balance" }
        default: { $ref: "#/components/responses/Error" }

  /v1/balance_transactions:
    get:
      operationId: ListBalanceTransactions
      summary: Every change to the merchant's balance, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
      responses:
        "200":
          description: A page of balance transactions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceTransactionList" }
        default: { $ref: "#/components/responses/Error" }

  /v1/balance_transactions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: GetBalanceTransaction
      summary: Retrieve a balance transaction
      responses:
        "200":
          description: The balance transaction.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceTransaction" }
        default: { $ref: "#/components/responses/Error" }

  /v1/checkout/sessions:
    get:
      operationId: ListCheckoutSessions
      summary: List Checkout Sessions, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
      responses:
        "200":
          description: A page of Checkout Sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSessionList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: CreateCheckoutSession
      summary: Create a hosted payment page
      description: |
        Returns a session whose `url` is a payment page this server hosts. Send the buyer there; after
        paying they are redirected to `success_url`, where `{CHECKOUT_SESSION_ID}` is replaced with the
        session's ID. The session creates its PaymentIntent immediately. A session stays payable until
        `expires_at` (24 hours by default) or until it is expired through the API.

        Line items use Stripe's array syntax:
        `line_items[0][price_data][currency]=usd`, `line_items[0][price_data][unit_amount]=2000`,
        `line_items[0][price_data][product_data][name]=T-shirt`, `line_items[0][quantity]=1`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [mode, success_url]
              properties:
                mode: { type: string, enum: [payment] }
                line_items:
                  type: object
                  description: |
                    Up to 100 items, indexed from 0. Each needs price_data[currency],
                    price_data[unit_amount], price_data[product_data][name] and quantity (1 to 999999).
                success_url: { type: string, maxLength: 5000 }
                cancel_url: { type: string, maxLength: 5000 }
                customer: { type: string, description: "A cus_ ID; its PaymentIntent is attached to it." }
                customer_email: { type: string, maxLength: 512, description: "Prefills the email field. Not with customer." }
                client_reference_id: { type: string, maxLength: 200 }
                expires_at: { type: integer, description: "Unix seconds, 30 minutes to 24 hours from now." }
                metadata: { $ref: "#/components/schemas/MetadataParam" }
            encoding:
              metadata: { style: deepObject, explode: true }
              line_items: { style: deepObject, explode: true }
      responses:
        "200":
          description: The Checkout Session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        default: { $ref: "#/components/responses/Error" }

  /v1/checkout/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/CheckoutSessionID"
    get:
      operationId: GetCheckoutSession
      summary: Retrieve a Checkout Session
      responses:
        "200":
          description: The Checkout Session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        default: { $ref: "#/components/responses/Error" }

  /v1/checkout/sessions/{id}/line_items:
    parameters:
      - $ref: "#/components/parameters/CheckoutSessionID"
    get:
      operationId: ListCheckoutSessionLineItems
      summary: The items a Checkout Session charges for
      responses:
        "200":
          description: All of the session's line items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineItemList" }
        default: { $ref: "#/components/responses/Error" }

  /v1/checkout/sessions/{id}/expire:
    parameters:
      - $ref: "#/components/parameters/CheckoutSessionID"
    post:
      operationId: ExpireCheckoutSession
      summary: Close an open Checkout Session so it can no longer be paid
      description: |
        Cancels the session's PaymentIntent. Fails if the session is not open, or if a payment is in
        progress on it.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The expired Checkout Session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        default: { $ref: "#/components/responses/Error" }

  /v1/events:
    get:
      operationId: ListEvents
      summary: List events, newest first (the order they happened in, reversed)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
        - name: type
          in: query
          description: Only events of this type, or of a group such as payment_intent.*.
          schema: { type: string }
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventList" }
        default: { $ref: "#/components/responses/Error" }

  /v1/events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: GetEvent
      summary: Retrieve an event
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        default: { $ref: "#/components/responses/Error" }

  /v1/webhook_endpoints:
    get:
      operationId: ListWebhookEndpoints
      summary: List webhook endpoints, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - $ref: "#/components/parameters/EndingBefore"
      responses:
        "200":
          description: A page of webhook endpoints.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointList" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: CreateWebhookEndpoint
      summary: Register a URL to receive events; the response holds its signing secret, shown only here
      description: |
        Every event of a subscribed type is POSTed to url as JSON, with a Stripe-Signature header
        "t=<unix>,v1=<hex HMAC-SHA256 of '<t>.<body>' keyed with the secret>". Delivery is at least once:
        anything but a 2xx answer is retried with backoff for up to 3 days, and events reach an endpoint
        in the order they happened. Deduplicate on the event id. Live mode endpoints must use https.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, maxLength: 2048 }
                enabled_events: { $ref: "#/components/schemas/EnabledEventsParam" }
                description: { type: string, maxLength: 5000 }
      responses:
        "200":
          description: The new endpoint, with its secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        default: { $ref: "#/components/responses/Error" }

  /v1/webhook_endpoints/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: GetWebhookEndpoint
      summary: Retrieve a webhook endpoint
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: UpdateWebhookEndpoint
      summary: Change a webhook endpoint's URL, events or description, or disable it
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                url: { type: string, maxLength: 2048 }
                enabled_events: { $ref: "#/components/schemas/EnabledEventsParam" }
                description: { type: string, maxLength: 5000 }
                disabled: { type: boolean, description: A disabled endpoint receives nothing until enabled again. }
      responses:
        "200":
          description: The updated endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: DeleteWebhookEndpoint
      summary: Delete a webhook endpoint; deliveries still queued for it are dropped
      responses:
        "200":
          description: The deletion marker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedWebhookEndpoint" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A secret key, sk_test_... or sk_live_...

  parameters:
    CheckoutSessionID:
      name: id
      in: path
      required: true
      schema: { type: string }
    IntentID:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Retrying with the same key within 24 hours replays the first response.
      schema: { type: string, maxLength: 255 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    StartingAfter:
      name: starting_after
      in: query
      description: An object ID; returns the page after it.
      schema: { type: string }
    EndingBefore:
      name: ending_before
      in: query
      description: An object ID; returns the page before it.
      schema: { type: string }

  responses:
    Error:
      description: An error, in the one shape every endpoint uses.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        database: { type: string, enum: [up, down] }

    Account:
      type: object
      additionalProperties: false
      required: [id, object, livemode]
      properties:
        id: { type: integer }
        object: { type: string, enum: [account] }
        livemode: { type: boolean }

    CaptureMethod:
      type: string
      enum: [automatic, automatic_async, manual]
      description: |
        automatic and automatic_async both capture right after authorization; manual waits for
        /capture. Omitted, it defaults to automatic_async (automatic before version 2026-10-23).

    CancellationReason:
      type: string
      enum: [duplicate, fraudulent, requested_by_customer, abandoned]

    MetadataParam:
      type: object
      description: metadata[key]=value sets a key, metadata[key]= unsets it, metadata= clears all.
      additionalProperties: { type: string, maxLength: 500 }

    PaymentError:
      type: object
      additionalProperties: false
      required: [type, code, message]
      properties:
        type: { type: string, enum: [card_error] }
        code: { type: string }
        decline_code: { type: string }
        message: { type: string }
        payment_method: { type: string }

    PaymentIntent:
      type: object
      additionalProperties: false
      required: [id, object, amount, amount_capturable, amount_received, canceled_at, cancellation_reason,
                 capture_method, created, currency, customer, description, last_payment_error, livemode, metadata,
                 payment_method, status]
      properties:
        id: { type: string, pattern: "^pi_" }
        object: { type: string, enum: [payment_intent] }
        amount: { type: integer, minimum: 1 }
        amount_capturable: { type: integer, minimum: 0 }
        amount_received: { type: integer, minimum: 0 }
        canceled_at: { type: integer, nullable: true }
        cancellation_reason:
          type: string
          nullable: true
          enum: [duplicate, fraudulent, requested_by_customer, abandoned, null]
        capture_method: { $ref: "#/components/schemas/CaptureMethod" }
        created: { type: integer, description: Unix seconds. }
        currency: { type: string, pattern: "^[a-z]{3}$" }
        customer: { type: string, nullable: true }
        description: { type: string, nullable: true }
        last_payment_error:
          allOf: [{ $ref: "#/components/schemas/PaymentError" }]
          nullable: true
        livemode: { type: boolean }
        metadata:
          type: object
          additionalProperties: { type: string }
        payment_method: { type: string, nullable: true }
        status:
          type: string
          enum: [requires_payment_method, requires_confirmation, requires_action, processing,
                 requires_capture, succeeded, canceled]

    PaymentIntentList:
      type: object
      additionalProperties: false
      required: [object, url, has_more, data]
      properties:
        object: { type: string, enum: [list] }
        url: { type: string }
        has_more: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/PaymentIntent" }

    CustomerParams:
      type: object
      properties:
        email: { type: string, maxLength: 512 }
        name: { type: string, maxLength: 256 }
        description: { type: string, maxLength: 1000 }
        metadata: { $ref: "#/components/schemas/MetadataParam" }

    Customer:
      type: object
      additionalProperties: false
      required: [id, object, created, description, email, livemode, metadata, name]
      properties:
        id: { type: string, pattern: "^cus_" }
        object: { type: string, enum: [customer] }
        created: { type: integer }
        description: { type: string, nullable: true }
        email: { type: string, nullable: true }
        livemode: { type: boolean }
        metadata:
          type: object
          additionalProperties: { type: string }
        name: { type: string, nullable: true }

    DeletedCustomer:
      type: object
      additionalProperties: false
      required: [id, object, deleted]
      properties:
        id: { type: string }
        object: { type: string, enum: [customer] }
        deleted: { type: boolean, enum: [true] }

    CustomerList:
      type: object
      additionalProperties: false
      required: [object, url, has_more, data]
      properties:
        object: { type: string, enum: [list] }
        url: { type: string }
        has_more: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/Customer" }

    Refund:
      type: object
      additionalProperties: false
      required: [id, object, amount, created, currency, failure_reason, metadata, payment_intent, reason, status]
      properties:
        id: { type: string, pattern: "^re_" }
        object: { type: string, enum: [refund] }
        amount: { type: integer, minimum: 1 }
        created: { type: integer }
        currency: { type: string }
        failure_reason: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: { type: string }
        payment_intent: { type: string }
        reason:
          type: string
          nullable: true
          enum: [duplicate, fraudulent, requested_by_customer, null]
        status: { type: string, enum: [pending, succeeded, failed] }

    RefundList:
      type: object
      additionalProperties: false
      required: [object, url, has_more, data]
      properties:
        object: { type: string, enum: [list] }
        url: { type: string }
        has_more: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/Refund" }

    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: { type: integer }
        currency: { type: string, pattern: "^[a-z]{3}$" }

    Balance:
      type: object
      additionalProperties: false
      required: [object, available, livemode, pending]
      properties:
        object: { type: string, enum: [balance] }
        available:
          type: array
          description: Funds that can be paid out (filled by payouts, Phase 4).
          items: { $ref: "#/components/schemas/Money" }
        livemode: { type: boolean }
        pending:
          type: array
          description: Funds from charges, net of fees, not yet available.
          items: { $ref: "#/components/schemas/Money" }

    BalanceTransaction:
      type: object
      additionalProperties: false
      required: [id, object, amount, created, currency, description, fee, net, source, status, type]
      properties:
        id: { type: string, pattern: "^txn_" }
        object: { type: string, enum: [balance_transaction] }
        amount: { type: integer, description: "Gross amount: net + fee. Negative for money leaving the balance." }
        created: { type: integer }
        currency: { type: string }
        description: { type: string }
        fee: { type: integer, description: "Kept by the platform." }
        net: { type: integer, description: "The change to the merchant's balance." }
        source: { type: string, description: "The object that caused it: a PaymentIntent or a Refund." }
        status: { type: string, enum: [pending, available] }
        type: { type: string, enum: [charge, refund] }

    BalanceTransactionList:
      type: object
      additionalProperties: false
      required: [object, url, has_more, data]
      properties:
        object: { type: string, enum: [list] }
        url: { type: string }
        has_more: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/BalanceTransaction" }

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [type, message]
          properties:
            type:
              type: string
              enum: [api_error, card_error, idempotency_error, invalid_request_error]
            code: { type: string }
            decline_code: { type: string }
            param: { type: string }
            message: { type: string }
            payment_intent: { $ref: "#/components/schemas/PaymentIntent" }

    CheckoutSession:
      type: object
      additionalProperties: false
      required: [id, object, amount_subtotal, amount_total, cancel_url, client_reference_id, created, currency,
                 customer, customer_details, customer_email, expires_at, livemode, metadata, mode, payment_intent,
                 payment_status, status, success_url, url]
      properties:
        id: { type: string, pattern: "^cs_(test|live)_" }
        object: { type: string, enum: [checkout.session] }
        amount_subtotal: { type: integer }
        amount_total: { type: integer }
        cancel_url: { type: string, nullable: true }
        client_reference_id: { type: string, nullable: true }
        created: { type: integer }
        currency: { type: string, pattern: "^[a-z]{3}$" }
        customer: { type: string, nullable: true }
        customer_details:
          type: object
          nullable: true
          additionalProperties: false
          required: [email]
          properties:
            email: { type: string, nullable: true, description: The email the buyer entered on the page. }
        customer_email: { type: string, nullable: true }
        expires_at: { type: integer }
        livemode: { type: boolean }
        metadata:
          type: object
          additionalProperties: { type: string }
        mode: { type: string, enum: [payment] }
        payment_intent: { type: string, pattern: "^pi_" }
        payment_status: { type: string, enum: [paid, unpaid] }
        status: { type: string, enum: [open, complete, expired] }
        success_url: { type: string }
        url: { type: string, nullable: true, description: The payment page; null once the session is not open. }

    CheckoutSessionList:
      type: object
      additionalProperties: false
      required: [object, url, has_more, data]
      properties:
        object: { type: string, enum: [list] }
        url: { type: string }
        has_more: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/CheckoutSession" }

    LineItem:
      type: object
      additionalProperties: false
      required: [id, object, amount_total, currency, description, quantity, unit_amount]
      properties:
        id: { type: string, pattern: "^li_" }
        object: { type: string, enum: [item] }
        amount_total: { type: integer }
        currency: { type: string }
        description: { type: string }
        quantity: { type: integer }
        unit_amount: { type: integer }

    LineItemList:
      type: object
      additionalProperties: false
      required: [object, url, has_more, data]
      properties:
        object: { type: string, enum: [list] }
        url: { type: string }
        has_more: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/LineItem" }

    EventType:
      type: string
      enum: [checkout.session.completed, checkout.session.expired, payment_intent.amount_capturable_updated, payment_intent.canceled, payment_intent.created, payment_intent.payment_failed, payment_intent.processing, payment_intent.succeeded, refund.created, refund.failed, refund.updated]

    EnabledEventsParam:
      type: array
      description: Event types to send, as enabled_events[]=payment_intent.succeeded; "*" means all.
      items:
        type: string
        enum: ["*", checkout.session.completed, checkout.session.expired, payment_intent.amount_capturable_updated, payment_intent.canceled, payment_intent.created, payment_intent.payment_failed, payment_intent.processing, payment_intent.succeeded, refund.created, refund.failed, refund.updated]

    Event:
      type: object
      additionalProperties: false
      required: [id, object, api_version, created, data, livemode, pending_webhooks, type]
      properties:
        id: { type: string, pattern: "^evt_" }
        object: { type: string, enum: [event] }
        api_version: { type: string, description: The API version data.object is rendered in. }
        created: { type: integer }
        data:
          type: object
          additionalProperties: false
          required: [object]
          properties:
            object: { type: object, description: "The object as it was right after the change: a PaymentIntent, Refund or Checkout Session." }
        livemode: { type: boolean }
        pending_webhooks: { type: integer, minimum: 0, description: Deliveries of this event not yet acknowledged. }
        type: { $ref: "#/components/schemas/EventType" }

    EventList:
      type: object
      additionalProperties: false
      required: [object, url, has_more, data]
      properties:
        object: { type: string, enum: [list] }
        url: { type: string }
        has_more: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/Event" }

    WebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, object, created, description, enabled_events, livemode, status, url]
      properties:
        id: { type: string, pattern: "^we_" }
        object: { type: string, enum: [webhook_endpoint] }
        created: { type: integer }
        description: { type: string, nullable: true }
        enabled_events:
          type: array
          items: { type: string }
        livemode: { type: boolean }
        secret: { type: string, pattern: "^whsec_", description: Only in the response that created the endpoint. }
        status: { type: string, enum: [enabled, disabled] }
        url: { type: string }

    WebhookEndpointList:
      type: object
      additionalProperties: false
      required: [object, url, has_more, data]
      properties:
        object: { type: string, enum: [list] }
        url: { type: string }
        has_more: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/WebhookEndpoint" }

    DeletedWebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, object, deleted]
      properties:
        id: { type: string }
        object: { type: string, enum: [webhook_endpoint] }
        deleted: { type: boolean, enum: [true] }
